<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>
try {
  document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
} catch {}
</script>
<title>d3-blockmap configurator</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles.css" />
<!-- d3-array.mjs pre-bundles its internmap dependency, so no separate import map entry is needed for it. -->
<script type="importmap">
{ "imports": {
  "@unpunnyfuns/d3-blockmap": "/dist/index.js",
  "@unpunnyfuns/d3-blockmap/brush": "/dist/brush/index.js",
  "d3-array": "/node_modules/d3-array/dist/d3-array.mjs",
  "d3-brush": "/node_modules/d3-brush/dist/d3-brush.mjs",
  "d3-color": "/node_modules/d3-color/dist/d3-color.mjs",
  "d3-dispatch": "/node_modules/d3-dispatch/dist/d3-dispatch.mjs",
  "d3-drag": "/node_modules/d3-drag/dist/d3-drag.mjs",
  "d3-ease": "/node_modules/d3-ease/dist/d3-ease.mjs",
  "d3-interpolate": "/node_modules/d3-interpolate/dist/d3-interpolate.mjs",
  "d3-selection": "/node_modules/d3-selection/dist/d3-selection.mjs",
  "d3-timer": "/node_modules/d3-timer/dist/d3-timer.mjs",
  "d3-transition": "/node_modules/d3-transition/dist/d3-transition.mjs"
} }
</script>
<script type="module" src="main.js"></script>
</head>
<body>
<header>
  <h1>d3-blockmap</h1>
  <p>Configure a block map and copy the code for it.</p>
</header>

<section class="stage" aria-label="Preview">
  <div class="stage-head">
    <span id="progress" role="status"></span>
    <span class="actions">
      <button type="button" id="toggle">Pause</button>
      <button type="button" id="restart">Restart</button>
      <button type="button" id="reset-view">Reset view</button>
      <button type="button" id="clear-brush" hidden>Clear selection</button>
    </span>
  </div>
  <div id="map" class="map"></div>
  <p class="hint" id="hint"></p>
  <dl class="events" id="events">
    <div data-event="onViewChange" hidden><dt>onViewChange</dt><dd></dd></div>
    <div data-event="onBrush" hidden><dt>onBrush</dt><dd></dd></div>
    <div data-event="onBrushEnd" hidden><dt>onBrushEnd</dt><dd></dd></div>
    <div data-event="onBlockClick" hidden><dt>onBlockClick</dt><dd></dd></div>
  </dl>
</section>

<main>
  <form id="config" aria-label="Configuration">
    <fieldset>
      <legend>Presets</legend>
      <div class="row">
        <button type="button" data-preset="streaming">Streaming, 10M</button>
        <button type="button" data-preset="discrete">Discrete, 40</button>
        <button type="button" data-preset="ranges">Ranges with brush</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Data</legend>
      <label>totalBlocks
        <input type="number" name="totalBlocks" min="1" max="4294967295" step="1" value="10000000" list="totals" />
      </label>
      <datalist id="totals">
        <option value="40"></option>
        <option value="1000"></option>
        <option value="1000000"></option>
        <option value="10000000"></option>
        <option value="1000000000"></option>
      </datalist>
      <label>Fill order
        <select name="source">
          <option value="sequential">Start to end</option>
          <option value="random">Random</option>
          <option value="ranges">Random growing ranges</option>
        </select>
      </label>
      <label>Duration, seconds
        <input type="number" name="duration" min="0" max="3600" step="1" value="60" />
      </label>
      <label>Target fill <output name="targetFillValue"></output>
        <input type="range" name="targetFill" min="0" max="100" step="1" value="100" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Display</legend>
      <label>partial
        <select name="partial">
          <option value="coverage">coverage</option>
          <option value="gradient">gradient</option>
        </select>
      </label>
      <label>Height <output name="heightValue"></output>
        <input type="range" name="height" min="4" max="64" step="1" value="24" />
      </label>
      <label class="check"><input type="checkbox" name="interactive" checked /> interactive</label>
      <label class="check"><input type="checkbox" name="highlight" /> highlight incomplete</label>
    </fieldset>

    <fieldset>
      <legend>Axis, brush, tooltip</legend>
      <label class="check"><input type="checkbox" name="axis" /> axis</label>
      <label>tickCount
        <input type="number" name="tickCount" min="2" max="20" step="1" placeholder="auto" />
      </label>
      <label class="check"><input type="checkbox" name="brush" /> brush</label>
      <label>tooltip
        <select name="tooltip">
          <option value="default">Built-in text</option>
          <option value="custom">Custom function</option>
          <option value="off">false</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Callbacks</legend>
      <label class="check"><input type="checkbox" name="onViewChange" /> onViewChange</label>
      <label class="check"><input type="checkbox" name="onBrush" /> onBrush</label>
      <label class="check"><input type="checkbox" name="onBrushEnd" /> onBrushEnd</label>
      <label class="check"><input type="checkbox" name="onBlockClick" /> onBlockClick</label>
    </fieldset>

    <fieldset>
      <legend>Theme</legend>
      <label>Colour scheme
        <select id="scheme">
          <option value="light dark">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <div class="colors">
        <label><input type="color" name="--blockmap-missing" data-color /> missing</label>
        <label><input type="color" name="--blockmap-complete" data-color /> complete</label>
        <label><input type="color" name="--blockmap-partial" data-color /> partial</label>
        <label><input type="color" name="--blockmap-partial-low" data-color /> partial-low</label>
        <label><input type="color" name="--blockmap-partial-high" data-color /> partial-high</label>
        <label><input type="color" name="--blockmap-highlight" data-color /> highlight</label>
        <label><input type="color" name="--blockmap-brush" data-color /> brush</label>
        <label><input type="color" name="--blockmap-axis-color" data-color /> axis-color</label>
      </div>
      <button type="button" id="reset-colors">Reset colours</button>
    </fieldset>
  </form>

  <div class="code">
    <section aria-labelledby="js-title">
      <div class="code-head">
        <h2 id="js-title">JavaScript</h2>
        <span class="copy">
          <button type="button" command="--copy" commandfor="snippet-js">Copy JavaScript</button>
          <span class="tip" role="status"></span>
        </span>
      </div>
      <pre><code id="snippet-js"></code></pre>
    </section>
    <section aria-labelledby="react-title">
      <div class="code-head">
        <h2 id="react-title">React</h2>
        <span class="copy">
          <button type="button" command="--copy" commandfor="snippet-react">Copy React</button>
          <span class="tip" role="status"></span>
        </span>
      </div>
      <pre><code id="snippet-react"></code></pre>
    </section>
    <section aria-labelledby="css-title">
      <div class="code-head">
        <h2 id="css-title">CSS</h2>
        <span class="copy">
          <button type="button" command="--copy" commandfor="snippet-css">Copy CSS</button>
          <span class="tip" role="status"></span>
        </span>
      </div>
      <pre><code id="snippet-css"></code></pre>
    </section>
  </div>
</main>
</body>
</html>
