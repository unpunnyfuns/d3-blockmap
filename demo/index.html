<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>d3-blockmap demo</title>
<style>
  :root {
    --blockmap-missing: #1f2430;
    --blockmap-partial-low: #5a3d12;
    --blockmap-partial-high: #f0b429;
    --blockmap-partial: #f0b429;
    --blockmap-complete: #3ddc84;
    --blockmap-highlight: #ff4d4f;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --blockmap-missing: #e3e6ec;
    --blockmap-partial-low: #ffd9a8;
    --blockmap-partial-high: #ff8c00;
    --blockmap-partial: #ff8c00;
    --blockmap-complete: #1a9e4b;
    --blockmap-highlight: #d4380d;
    color-scheme: light;
  }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; background: Canvas; color: CanvasText; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  section { margin-bottom: 32px; }
  .label { display: flex; justify-content: space-between; margin-bottom: 6px; color: GrayText; }
  .map { height: 24px; }
  .map canvas { border-radius: 3px; }
  [data-blockmap-tooltip] { background: #000c; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-top: -6px; }
  button { margin-right: 8px; }
</style>
</head>
<body>
<h1>d3-blockmap</h1>
<section>
  <div class="label"><span>10,000,000 blocks, streaming, gradient style</span><span id="big-progress"></span></div>
  <div id="big" class="map"></div>
</section>
<section>
  <div class="label"><span>40 blocks, discrete mode</span><span id="small-progress"></span></div>
  <div id="small" class="map"></div>
</section>
<section>
  <div class="label"><span>10,000,000 blocks, range snapshots, coverage style</span><span id="ranges-progress"></span></div>
  <div id="ranges" class="map"></div>
</section>
<p>
  <button id="toggle">Pause</button>
  <button id="theme">Toggle theme</button>
  <button id="reset">Reset</button>
  <button id="highlight">Highlight incomplete</button>
  <button id="reset-view">Reset view</button>
</p>
<p class="label">Ctrl+wheel (or pinch) zooms around the cursor, drag pans, double-click resets. <span id="view"></span></p>
<script type="importmap">
{ "imports": {
  "d3-blockmap": "/dist/index.js",
  "d3-color": "/node_modules/d3-color/dist/d3-color.mjs",
  "d3-interpolate": "/node_modules/d3-interpolate/dist/d3-interpolate.mjs"
} }
</script>
<script type="module">
import { createBlockMap } from "d3-blockmap";

const BIG = 10_000_000;
const SMALL = 40;
const BATCH = 2_500;
const FRONTS = 6;

const big = createBlockMap(document.querySelector("#big"), { totalBlocks: BIG, partial: "gradient" });
const small = createBlockMap(document.querySelector("#small"), { totalBlocks: SMALL, initialBlocks: [0, 1, 2, 7, 8, 20, 21, 22, 23, 39] });
const rangeMap = createBlockMap(document.querySelector("#ranges"), {
  totalBlocks: BIG,
  partial: "coverage",
  onViewChange: (view) => {
    document.querySelector("#view").textContent = `View ${fmt.format(view.start)}–${fmt.format(view.end - 1)}`;
  },
});
const RUN_SEED = 24;
const RUN_MAX = 400;
const RUN_START_LENGTH = 20_000;
const RUN_GROWTH = 120;
const NEW_RUN_EVERY = 20;
const SNAPSHOT_EVERY = 5;
const runs = [];
const addRun = () =>
  runs.push([Math.floor(Math.random() * BIG), Math.floor(Math.random() * RUN_START_LENGTH)]);
const seedRuns = () => {
  runs.length = 0;
  for (let i = 0; i < RUN_SEED; i += 1) addRun();
};
seedRuns();
let rangeTick = 0;
const stepRanges = () => {
  rangeTick += 1;
  for (const run of runs) {
    const left = Math.min(run[0], Math.floor(Math.random() * RUN_GROWTH));
    run[0] -= left;
    run[1] += left + Math.floor(Math.random() * RUN_GROWTH);
  }
  if (rangeTick % NEW_RUN_EVERY === 0 && runs.length < RUN_MAX) addRun();
  if (rangeTick % SNAPSHOT_EVERY === 0) {
    rangeMap.setRanges(runs.map(([start, length]) => [start, start + length]));
  }
};

const fmt = new Intl.NumberFormat("en-US");
const showProgress = (map, el) => {
  const { completed, total } = map.getProgress();
  el.textContent = `${fmt.format(completed)} / ${fmt.format(total)} (${((completed / total) * 100).toFixed(2)}%)`;
};

const maps = [big, small, rangeMap];
const LABEL_INTERVAL_MS = 500;
let lastLabelUpdate = 0;
const updateLabels = () => {
  showProgress(big, document.querySelector("#big-progress"));
  showProgress(small, document.querySelector("#small-progress"));
  showProgress(rangeMap, document.querySelector("#ranges-progress"));
};

const fronts = Array.from({ length: FRONTS }, () => Math.floor(Math.random() * BIG));
let running = true;
let smallTick = 0;

const step = () => {
  if (running) {
    const batch = new Uint32Array(BATCH);
    for (let i = 0; i < BATCH; i += 1) {
      const f = i % FRONTS;
      const sequential = i % 3 !== 0;
      batch[i] = sequential ? (fronts[f] = (fronts[f] + 1) % BIG) : Math.floor(Math.random() * BIG);
    }
    big.addBlocks(batch);
    smallTick += 1;
    if (smallTick % 30 === 0) small.addBlocks([Math.floor(Math.random() * SMALL)]);
    stepRanges();
    const now = performance.now();
    if (now - lastLabelUpdate >= LABEL_INTERVAL_MS) {
      updateLabels();
      lastLabelUpdate = now;
    }
    if (maps.every((map) => { const p = map.getProgress(); return p.completed === p.total; })) {
      running = false;
      document.querySelector("#toggle").textContent = "Done";
      updateLabels();
    }
  }
  requestAnimationFrame(step);
};
step();

document.querySelector("#toggle").onclick = (e) => { running = !running; e.target.textContent = running ? "Pause" : "Resume"; };
document.querySelector("#theme").onclick = () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === "light" ? "" : "light";
};
let highlighted = false;
document.querySelector("#highlight").onclick = (e) => {
  highlighted = !highlighted;
  maps.forEach((map) => map.setHighlight(highlighted));
  e.target.textContent = highlighted ? "Stop highlight" : "Highlight incomplete";
};
document.querySelector("#reset-view").onclick = () => maps.forEach((map) => map.resetView());
document.querySelector("#reset").onclick = () => {
  big.setBlocks([]);
  small.setBlocks([]);
  seedRuns();
  rangeMap.setRanges([]);
  running = true;
  document.querySelector("#toggle").textContent = "Pause";
};
</script>
</body>
</html>
